args:
- description: List of target device serial numbers to be upgraded
  isArray: true
  name: TargetDevices
  required: true
- description: Target software version for the upgrades
  name: TargetVersion
  required: true
- auto: PREDEFINED
  defaultValue: NGFW
  name: DeviceType
  predefined:
  - NGFW
  - Panorama
- default: true
  defaultValue: PAN-OS Network Operations - Device Upgrade
  description: The name of the playbook to run on the created alerts, defaults to "PAN-OS Network Operations - Device Upgrade"
  name: Playbook
- description: The domain to create the incident/alert in.  If not set, then the domain on the calling alert will be used
  name: Domain
- defaultValue: 'false'
  description: This determines if the alerts are to be auto-started.
  name: Auto
comment: Uses the core-api generic POST integration command to create upgrade alerts for each device.
