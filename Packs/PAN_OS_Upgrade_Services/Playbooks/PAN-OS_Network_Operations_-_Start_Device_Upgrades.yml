inputs:
- key: Automatically Upgrade
  value:
    simple: ${alert.panosnetworkoperationsautomaticupgrade}
  required: false
  description: If set to true, will automatically start all device ugprades.
  playbookInputQuery: null
- key: alert_ids
  value: {}
  required: false
  description: List of alert IDs corresponding to device upgrade alerts to start.
  playbookInputQuery: null
- key: PanoramaDevices
  value: {}
  required: false
  description: A list of Panorama device IDs to upgrade
  playbookInputQuery: null
- key: NGFWDevices
  value: {}
  required: false
  description: A list of NGFW device IDs to upgrade
  playbookInputQuery: null
inputSections:
- inputs:
  - Automatically Upgrade
  - alert_ids
  - PanoramaDevices
  - NGFWDevices
  name: General (Inputs group)
  description: Generic group for inputs
outputSections:
- outputs: []
  name: General (Outputs group)
  description: Generic group for outputs
outputs: []
dirtyInputs: true
