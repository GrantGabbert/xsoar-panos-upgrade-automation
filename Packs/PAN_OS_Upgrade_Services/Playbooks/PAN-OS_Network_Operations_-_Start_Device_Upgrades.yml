id: PAN-OS Network Operations - Start Device Upgrades
version: 9
vcShouldKeepItemLegacyProdMachine: false
name: PAN-OS Network Operations - Start Device Upgrades
description: |-
  This playbook is used by the Batch Upgrade playbook to start (either manually or automatically) groups of Device Upgrade alerts.

  It works by first retrieving the devices that have upgrades pending, then marking the pause tasks within them complete in batches.
starttaskid: "0"
tasks:
  "0":
    id: "0"
    taskid: c40c8791-2ff3-4793-8768-2edc199f0059
    type: start
    task:
      id: c40c8791-2ff3-4793-8768-2edc199f0059
      version: -1
      name: ""
      iscommand: false
      brand: ""
    nexttasks:
      '#none#':
      - "5"
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": -80
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "1":
    id: "1"
    taskid: 44406794-5660-4b7e-a32a-626a2f0e9a96
    type: condition
    task:
      id: 44406794-5660-4b7e-a32a-626a2f0e9a96
      version: -1
      name: Is auto-upgrade enabled?
      description: Check for automatic upgrade switch
      type: condition
      iscommand: false
      brand: ""
    nexttasks:
      '#default#':
      - "3"
      "yes":
      - "2"
    separatecontext: false
    conditions:
    - label: "yes"
      condition:
      - - operator: isTrue
          left:
            value:
              simple: inputs.Automatically Upgrade
            iscontext: true
          right:
            value: {}
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 190
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "2":
    id: "2"
    taskid: e83a812e-8831-4628-bbd1-8502ef742621
    type: regular
    task:
      id: e83a812e-8831-4628-bbd1-8502ef742621
      version: -1
      name: Start device upgrades
      description: commands.local.cmd.task.complete
      script: Builtin|||taskComplete
      type: regular
      iscommand: true
      brand: Builtin
    nexttasks:
      '#none#':
      - "4"
    scriptarguments:
      alertId:
        simple: ${inputs.alert_ids}
      id:
        simple: start-upgrade
      incidentId:
        complex:
          root: inputs.incident_ids
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 580
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "3":
    id: "3"
    taskid: 46eb0257-4c19-44ab-a29e-e0ae34a11485
    type: condition
    task:
      id: 46eb0257-4c19-44ab-a29e-e0ae34a11485
      version: -1
      name: Begin Upgrades
      description: |-
        #### Do you want to start upgrading all devices?

        This will **start upgrades** on all of the devices, which may result in an **interruption to network traffic.**
      type: condition
      iscommand: false
      brand: ""
    nexttasks:
      "No":
      - "4"
      "Yes":
      - "2"
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 720,
          "y": 400
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    message:
      to: null
      subject: null
      body:
        simple: |-
          Do you want to start all device upgrades?

          This will start upgrades on the following devices;

          ${inputs.PanoramaDevices}

          ${inputs.NGFWDevices}
      methods: []
      format: ""
      bcc: null
      cc: null
      timings:
        retriescount: 2
        retriesinterval: 360
        completeafterreplies: 1
        completeafterv2: true
        completeaftersla: false
      replyOptions:
      - "Yes"
      - "No"
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "4":
    id: "4"
    taskid: 53c1ac20-e57f-422e-9cc2-decc51c25010
